<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Electro L&G | Tienda Oficial</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.js"></script>

    <style>
        :root { 
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #0084ff;
            --text-light: #f1f5f9;
            --text-dim: #94a3b8;
            --success-green: #22c55e;
            --danger-red: #ef4444;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            color: var(--text-light);
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        header { 
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 5%; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 100; 
            display: flex; flex-direction: column; align-items: center;
        }

        .header-top { display: flex; justify-content: space-between; width: 100%; max-width: 1200px; align-items: center; }
        .logo-img { height: 60px; max-width: 180px; object-fit: contain; cursor: pointer; }

        .nav-tabs { display: flex; gap: 10px; margin-top: 15px; }
        .nav-btn {
            background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue);
            padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-size: 0.9rem;
        }
        .nav-btn:hover { background: var(--accent-blue); color: white; }

        .container { padding: 20px; max-width: 1200px; margin: auto; }
        
        .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); } }
        
        .card { 
            background: var(--card-bg); border-radius: 15px; overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; cursor: pointer;
            position: relative;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-blue); }
        .card img { width: 100%; height: 180px; object-fit: cover; }

        .admin-controls {
            padding: 10px; display: flex; gap: 5px; background: rgba(0,0,0,0.5);
        }

        .modal-full { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg-dark); z-index: 1000; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }

        .admin-section { background: var(--card-bg); padding: 25px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #334155; }

        input, textarea, select { 
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
            background: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box;
        }

        .btn { 
            background: var(--accent-blue); color: white; border: none; padding: 15px; 
            border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; margin: 5px 0;
        }

        .whatsapp-float {
            position: fixed; bottom: 20px; left: 20px; 
            background: #25d366; color: white; width: 60px; height: 60px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 2000;
            text-decoration: none; transition: 0.3s;
        }

        .admin-dot { position: fixed; bottom: 10px; right: 10px; width: 25px; height: 25px; background: var(--accent-blue); border-radius: 50%; opacity: 0.1; cursor: pointer; z-index: 2000; }
        
        .detail-img { width: 100%; max-height: 400px; object-fit: contain; border-radius: 15px; background: #000; }
        .price-tag { font-size: 1.5rem; color: var(--accent-blue); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div id="logo-place">
            <img src="" alt="Electro L&G" class="logo-img" id="main-logo" onclick="location.reload()">
        </div>
        <div onclick="toggleCart()" style="cursor:pointer; font-size: 1.8rem; position: relative;">
            🛒<span id="cart-count" style="position: absolute; top: -5px; right: -10px; font-size: 0.8rem; background: var(--accent-blue); padding: 2px 7px; border-radius: 50%;">0</span>
        </div>
    </div>
    <div class="nav-tabs">
        <button class="nav-btn" onclick="toggleAbout()">👥 Quiénes Somos</button>
        <button class="nav-btn" onclick="toggleInfo()">🌿 ¿Cómo comprar?</button>
    </div>
</header>

<div class="container" id="main-view">
    <h2 style="text-align:center; color:var(--text-dim); margin-top: 50px;">Cargando catálogo...</h2>
</div>

<!-- Modales -->
<div id="modal-detalle" class="modal-full">
    <div class="container" style="max-width: 600px;">
        <div class="admin-section" id="detalle-contenido"></div>
        <button class="btn" style="background:#444;" onclick="closeModals()">VOLVER AL CATÁLOGO</button>
    </div>
</div>

<div id="modal-carrito" class="modal-full">
    <div class="container" style="max-width: 600px;">
        <div class="admin-section">
            <h2 style="color:var(--accent-blue)">🛒 Tu Pedido</h2>
            <div id="carrito-lista"></div>
            <hr style="border: 0.5px solid #334155; margin: 20px 0;">
            <div style="display:flex; justify-content: space-between; font-size: 1.2rem;">
                <span>Total:</span>
                <span id="total-precio" style="color:var(--accent-blue); font-weight:bold;">$0</span>
            </div>
            <button class="btn" style="background:var(--success-green); margin-top:20px;" onclick="enviarWhatsApp()">FINALIZAR POR WHATSAPP</button>
            <button class="btn" style="background:#444;" onclick="closeModals()">SEGUIR COMPRANDO</button>
        </div>
    </div>
</div>

<div id="modal-admin" class="modal-full">
    <div class="container" style="max-width: 700px;">
        <h2 style="color: var(--accent-blue);">Panel de Administración</h2>
        
        <div class="admin-section">
            <h3>⚙️ Gestión del Logo</h3>
            <input type="file" accept="image/*" onchange="initCropper(event)">
            <div id="cropper-container" style="display:none;">
                <div id="cropper-wrap"></div>
                <button class="btn" onclick="uploadLogo()">SUBIR LOGO</button>
            </div>
        </div>

        <div class="admin-section">
            <h3>📦 Agregar Nuevo Producto</h3>
            <input type="text" id="prod-nombre" placeholder="Nombre del producto">
            <input type="number" id="prod-precio" placeholder="Precio ($)">
            <input type="number" id="prod-stock" placeholder="Stock disponible">
            <textarea id="prod-desc" placeholder="Descripción del producto"></textarea>
            <input type="file" id="prod-img" accept="image/*">
            <button class="btn" onclick="subirProducto()">PUBLICAR PRODUCTO</button>
        </div>

        <button class="btn" style="background:#444;" onclick="closeModals()">SALIR DEL PANEL</button>
    </div>
</div>

<!-- Resto de modales (About, Info) omitidos por brevedad pero deben estar en tu código -->
<div id="modal-about" class="modal-full">...</div>
<div id="modal-info" class="modal-full">...</div>

<a href="https://wa.me/59899968118" class="whatsapp-float" target="_blank">
    <span style="margin-top:5px">💬</span>
</a>

<div class="admin-dot" onclick="authAdmin()"></div>

<script>
    const PHONE = "59899968118";
    const CLOUD_NAME = 'dbhqmddxv';
    const UPLOAD_PRESET = 'fotosfotos';

    const firebaseConfig = {
        apiKey: "AIzaSyCJI7RSjcJU0Ipvw7ZlKo-GMpAyDGkcgKQ",
        authDomain: "gaby-creations.firebaseapp.com",
        databaseURL: "https://gaby-creations-default-rtdb.firebaseio.com",
        projectId: "gaby-creations",
        storageBucket: "gaby-creations.firebasestorage.app",
        messagingSenderId: "775285506565",
        appId: "1:775285506565:web:8810e1d518fbaf62ead26c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let productos = {};
    let carrito = [];
    let isAdmin = false;
    let croppieInstance = null;

    // Escuchar logo
    db.ref('tienda/logo').on('value', s => {
        document.getElementById('main-logo').src = s.val() || 'https://placehold.co/200x80/0f172a/0084ff?text=L%26G';
    });

    // Escuchar productos
    db.ref('productos').on('value', s => {
        productos = s.val() || {};
        renderHome();
    });

    function renderHome() {
        const view = document.getElementById('main-view');
        const keys = Object.keys(productos);
        if (!keys.length) { view.innerHTML = "<h3>No hay productos.</h3>"; return; }
        
        let html = '<div class="grid">';
        keys.forEach(key => {
            const p = productos[key];
            html += `
            <div class="card">
                <div onclick="openDetail('${key}')">
                    <img src="${p.imgs ? p.imgs[0] : ''}">
                    <div style="padding:15px">
                        <strong>${p.nombre}</strong><br>
                        <span style="color:var(--accent-blue)">$${p.precio}</span>
                        <br><small style="color:var(--text-dim)">Stock: ${p.stock}</small>
                    </div>
                </div>
                ${isAdmin ? `
                    <div class="admin-controls">
                        <button onclick="editarStock('${key}')" style="flex:1; background: #334155; color:white; border:none; border-radius:5px; padding:5px;">📦 Stock</button>
                        <button onclick="borrarProducto('${key}')" style="background: var(--danger-red); color:white; border:none; border-radius:5px; padding:5px;">🗑️</button>
                    </div>
                ` : ''}
            </div>`;
        });
        view.innerHTML = html + '</div>';
    }

    async function subirProducto() {
        const nombre = document.getElementById('prod-nombre').value;
        const precio = document.getElementById('prod-precio').value;
        const stock = document.getElementById('prod-stock').value;
        const desc = document.getElementById('prod-desc').value;
        const file = document.getElementById('prod-img').files[0];

        if(!nombre || !precio || !file) return alert("Completa nombre, precio e imagen");

        // Subir a Cloudinary
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST', body: formData
            });
            const data = await res.json();
            
            const newKey = db.ref('productos').push().key;
            await db.ref('productos/' + newKey).set({
                nombre, precio: parseInt(precio), stock: parseInt(stock), descripcion: desc, imgs: [data.secure_url]
            });
            alert("Producto subido!");
            closeModals();
        } catch (e) { alert("Error al subir"); }
    }

    function editarStock(key) {
        const nuevo = prompt("Nuevo stock:", productos[key].stock);
        if(nuevo !== null) db.ref('productos/' + key).update({ stock: parseInt(nuevo) });
    }

    function borrarProducto(key) {
        if(confirm("¿Borrar este producto?")) db.ref('productos/' + key).remove();
    }

    function authAdmin() {
        const pass = prompt("Clave:");
        if (pass && btoa(pass) === "U2FjdWwyMDA0MTQu") {
            isAdmin = true;
            document.getElementById('modal-admin').style.display = 'block';
            renderHome();
        }
    }

    // --- Lógica de Carrito y Modales ---
    function openDetail(key) {
        const p = productos[key];
        const content = document.getElementById('detalle-contenido');
        content.innerHTML = `
            <img src="${p.imgs ? p.imgs[0] : ''}" class="detail-img">
            <h2 style="margin-top:20px">${p.nombre}</h2>
            <p class="price-tag">$${p.precio}</p>
            <p style="color:var(--text-dim)">${p.descripcion || 'Sin descripción disponible.'}</p>
            <div style="margin:20px 0">
                <label>Cantidad:</label>
                <select id="cantidad-sel">
                    ${Array.from({length: Math.min(p.stock || 1, 10)}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('')}
                </select>
            </div>
            <button class="btn" onclick="addToCart('${key}')">AÑADIR AL CARRITO</button>
        `;
        document.getElementById('modal-detalle').style.display = 'block';
    }

    function addToCart(key) {
        const cant = parseInt(document.getElementById('cantidad-sel').value);
        const p = productos[key];
        carrito.push({ ...p, cantidad: cant });
        updateCartUI();
        closeModals();
    }

    function updateCartUI() {
        document.getElementById('cart-count').innerText = carrito.length;
        const lista = document.getElementById('carrito-lista');
        let total = 0;
        lista.innerHTML = carrito.map((item, i) => {
            total += item.precio * item.cantidad;
            return `<div style="display:flex; justify-content:space-between; margin:10px 0;">
                <div><strong>${item.nombre}</strong> (x${item.cantidad})</div>
                <span>$${item.precio * item.cantidad}</span>
            </div>`;
        }).join('');
        document.getElementById('total-precio').innerText = `$${total}`;
    }

    function toggleCart() { closeModals(); document.getElementById('modal-carrito').style.display = 'block'; }
    function closeModals() { document.querySelectorAll('.modal-full').forEach(m => m.style.display = 'none'); }

    function enviarWhatsApp() {
        if (carrito.length === 0) return;
        let msg = "¡Hola Electro L&G! Mi pedido:\n";
        carrito.forEach(i => msg += `- ${i.nombre} (x${i.cantidad})\n`);
        window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`);
    }

    // --- Lógica del Logo (Croppie) ---
    function initCropper(e) {
        document.getElementById('cropper-container').style.display = 'block';
        const reader = new FileReader();
        reader.onload = function(event) {
            if (croppieInstance) croppieInstance.destroy();
            croppieInstance = new Croppie(document.getElementById('cropper-wrap'), {
                viewport: { width: 180, height: 70, type: 'square' },
                boundary: { width: 250, height: 120 }
            });
            croppieInstance.bind({ url: event.target.result });
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    async function uploadLogo() {
        const blob = await croppieInstance.result('blob');
        const formData = new FormData();
        formData.append('file', blob);
        formData.append('upload_preset', UPLOAD_PRESET);

        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
            method: 'POST', body: formData
        });
        const data = await res.json();
        db.ref('tienda/logo').set(data.secure_url);
        alert("Logo actualizado!");
        closeModals();
    }
</script>
</body>
</html>
